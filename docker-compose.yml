name: voicebench

services:
  model-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "model_init.py"]
    environment:
      MODEL_ROOT: /models
      XDG_CACHE_HOME: /models/cache
      HF_HOME: /models/huggingface
    volumes:
      - models:/models
    restart: "no"

  llama-gemma:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/llm/gemma-3-1b-it-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "${GEMMA_THREADS:-4}"
      - --parallel
      - "1"
      - --metrics
    volumes:
      - models:/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  llama-qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/llm-qwen/Qwen3-1.7B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "${QWEN_THREADS:-4}"
      - --parallel
      - "1"
      - --reasoning-budget
      - "0"
      - --metrics
    volumes:
      - models:/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  piper:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "piper.http_server", "--host", "0.0.0.0", "--port", "5000", "--data-dir", "/models/piper", "-m", "en_US-amy-medium"]
    volumes:
      - models:/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  nabra:
    build:
      context: .
      dockerfile: nabra/Dockerfile
    environment:
      NABRA_MODEL_ROOT: /models/nabra
      NABRA_THREADS: "${NABRA_THREADS:-4}"
      NABRA_SPEED: "${NABRA_SPEED:-1.0}"
      HF_HOME: /models/huggingface
    volumes:
      - models:/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMMA_URL: http://llama-gemma:8080
      QWEN_URL: http://llama-qwen:8080
      PIPER_EN_URL: http://piper:5000
      NABRA_URL: http://nabra:8000
      GEMMA_MODEL_NAME: gemma-3-1b-it
      QWEN_MODEL_NAME: Qwen3-1.7B
      DEFAULT_LLM_MODEL: "${DEFAULT_LLM_MODEL:-gemma}"
      MAX_TOKENS: "${MAX_TOKENS:-160}"
      MAX_TOKENS_AR: "${MAX_TOKENS_AR:-48}"
      ARABIC_MAX_WORDS: "${ARABIC_MAX_WORDS:-22}"
      HISTORY_MAX_MESSAGES: "${HISTORY_MAX_MESSAGES:-16}"
      MEMORY_MAX_ITEMS: "${MEMORY_MAX_ITEMS:-12}"
      MOONSHINE_VAD_THRESHOLD: "${MOONSHINE_VAD_THRESHOLD:-0.35}"
      DISTIL_WHISPER_PATH: /models/stt-distil-en
      DISTIL_WHISPER_THREADS: "${DISTIL_WHISPER_THREADS:-4}"
      XDG_CACHE_HOME: /models/cache
      HF_HOME: /models/huggingface
      SYSTEM_PROMPT: "${SYSTEM_PROMPT:-You are a concise voice assistant. Reply naturally in one to three short sentences. Avoid markdown.}"
      SYSTEM_PROMPT_AR: "${SYSTEM_PROMPT_AR:-أنت مساعد صوتي موجز. أجب بالعربية بشكل طبيعي في جملة إلى ثلاث جمل قصيرة، وتجنب تنسيق Markdown.}"
    volumes:
      # Moonshine creates short-lived FileLock files beside cached model assets.
      - models:/models
    depends_on:
      model-init:
        condition: service_completed_successfully
      llama-gemma:
        condition: service_healthy
      llama-qwen:
        condition: service_healthy
      piper:
        condition: service_healthy
      nabra:
        condition: service_healthy
    healthcheck:
      # Container readiness must only test FastAPI itself. Downstream model
      # readiness remains observable through /api/health without deadlocking
      # startup of the public gateway.
      test: ["CMD", "curl", "-fsS", "localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  models:
  caddy_data:
  caddy_config:
